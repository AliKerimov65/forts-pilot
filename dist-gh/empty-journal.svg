<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <!-- Пустое состояние журнала: раскрытый бортовой лог, строки, зелёная/красная стрелки, жёлтая закладка -->
  <g stroke="#2A3444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- левая страница -->
    <path d="M240 96 C 200 78 150 74 110 84 L 110 268 C 150 258 200 262 240 280 Z"/>
    <!-- правая страница -->
    <path d="M240 96 C 280 78 330 74 370 84 L 370 268 C 330 258 280 262 240 280 Z"/>
    <!-- корешок -->
    <line x1="240" y1="96" x2="240" y2="280"/>
    <!-- строки левой страницы -->
    <line x1="130" y1="116" x2="222" y2="108"/>
    <line x1="130" y1="140" x2="222" y2="132"/>
    <line x1="130" y1="164" x2="222" y2="156"/>
    <line x1="130" y1="188" x2="200" y2="182"/>
    <!-- строки правой страницы -->
    <line x1="258" y1="108" x2="350" y2="116"/>
    <line x1="258" y1="132" x2="350" y2="140"/>
    <line x1="258" y1="156" x2="350" y2="164"/>
    <line x1="258" y1="180" x2="328" y2="186"/>
  </g>
  <!-- зелёная стрелка вверх (сделка в плюс) -->
  <g stroke="#16C784" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="140" y1="238" x2="140" y2="214"/>
    <polyline points="132,222 140,214 148,222"/>
  </g>
  <!-- красная стрелка вниз (сделка в минус) -->
  <g stroke="#EA3943" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="176" y1="222" x2="176" y2="246"/>
    <polyline points="168,238 176,246 184,238"/>
  </g>
  <!-- жёлтая закладка -->
  <path d="M330 84 L 330 140 L 342 130 L 354 140 L 354 86" fill="none" stroke="#FFDD2D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <!-- Офлайн: разорванный штекер/сигнал, жёлтая искра в месте разрыва -->
  <!-- левый штекер -->
  <g stroke="#2A3444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 210 C 130 200 150 196 178 192"/>
    <rect x="178" y="170" width="56" height="44" rx="8"/>
    <line x1="234" y1="180" x2="252" y2="180"/>
    <line x1="234" y1="204" x2="252" y2="204"/>
  </g>
  <!-- правое гнездо -->
  <g stroke="#2A3444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 210 C 350 200 330 196 302 192"/>
    <rect x="302" y="170" width="56" height="44" rx="8"/>
    <line x1="302" y1="180" x2="288" y2="180"/>
    <line x1="302" y1="204" x2="288" y2="204"/>
  </g>
  <!-- жёлтая искра в разрыве -->
  <g stroke="#FFDD2D" stroke-width="3" stroke-linecap="round">
    <line x1="270" y1="176" x2="270" y2="160"/>
    <line x1="258" y1="184" x2="246" y2="174"/>
    <line x1="282" y1="184" x2="294" y2="174"/>
    <line x1="256" y1="200" x2="242" y2="200"/>
    <line x1="284" y1="200" x2="298" y2="200"/>
    <circle cx="270" cy="192" r="5" fill="#FFDD2D" stroke="none"/>
  </g>
  <!-- перечёркнутый сигнал -->
  <g stroke="#2A3444" stroke-width="3" stroke-linecap="round">
    <path d="M180 96 C 210 72 270 72 300 96"/>
    <path d="M198 118 C 220 100 260 100 282 118"/>
    <circle cx="240" cy="140" r="5"/>
    <line x1="168" y1="64" x2="312" y2="152" stroke="#EA3943"/>
  </g>
</svg>

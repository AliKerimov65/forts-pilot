<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <!-- Пустое состояние роботов: line-art робот на полке из свечей, жёлтый глаз-индикатор -->
  <!-- полка-свечи -->
  <g stroke="#2A3444" stroke-width="3" stroke-linecap="round">
    <line x1="96" y1="300" x2="96" y2="318"/>
    <rect x="86" y="276" width="20" height="24" rx="2"/>
    <line x1="140" y1="292" x2="140" y2="322"/>
    <rect x="130" y="262" width="20" height="30" rx="2"/>
    <line x1="184" y1="296" x2="184" y2="320"/>
    <rect x="174" y="272" width="20" height="24" rx="2"/>
    <line x1="300" y1="290" x2="300" y2="320"/>
    <rect x="290" y="266" width="20" height="26" rx="2"/>
    <line x1="344" y1="298" x2="344" y2="318"/>
    <rect x="334" y="274" width="20" height="24" rx="2"/>
    <line x1="388" y1="288" x2="388" y2="322"/>
    <rect x="378" y="262" width="20" height="28" rx="2"/>
  </g>
  <!-- робот -->
  <g stroke="#2A3444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- антенна -->
    <line x1="240" y1="86" x2="240" y2="64"/>
    <circle cx="240" cy="58" r="6"/>
    <!-- голова -->
    <rect x="196" y="86" width="88" height="64" rx="12"/>
    <!-- глаза -->
    <circle cx="222" cy="114" r="7"/>
    <!-- жёлтый глаз-индикатор -->
    <circle cx="258" cy="114" r="7" stroke="#FFDD2D"/>
    <circle cx="258" cy="114" r="3" fill="#FFDD2D" stroke="none"/>
    <!-- уши -->
    <rect x="184" y="104" width="12" height="24" rx="4"/>
    <rect x="284" y="104" width="12" height="24" rx="4"/>
    <!-- шея и тело -->
    <line x1="240" y1="150" x2="240" y2="162"/>
    <rect x="204" y="162" width="72" height="66" rx="12"/>
    <!-- панель на груди -->
    <line x1="218" y1="182" x2="262" y2="182"/>
    <line x1="218" y1="196" x2="250" y2="196"/>
    <circle cx="256" cy="210" r="4" stroke="#FFDD2D"/>
    <!-- руки -->
    <line x1="204" y1="176" x2="178" y2="204"/>
    <line x1="276" y1="176" x2="302" y2="204"/>
    <circle cx="176" cy="208" r="6"/>
    <circle cx="304" cy="208" r="6"/>
    <!-- ноги, сидит на полке -->
    <line x1="222" y1="228" x2="222" y2="262"/>
    <line x1="258" y1="228" x2="258" y2="262"/>
    <line x1="212" y1="262" x2="232" y2="262"/>
    <line x1="248" y1="262" x2="268" y2="262"/>
  </g>
</svg>

    <circle cx="160" cy="202" r="42"/>
    <circle cx="160" cy="202" r="10"/>
    <line x1="160" y1="160" x2="160" y2="176"/>
    <line x1="160" y1="228" x2="160" y2="244"/>
    <line x1="118" y1="202" x2="134" y2="202"/>
    <line x1="186" y1="202" x2="202" y2="202"/>
    <line x1="130" y1="172" x2="141" y2="183"/>
    <line x1="190" y1="172" x2="179" y2="183"/>
    <line x1="130" y1="232" x2="141" y2="221"/>
    <line x1="190" y1="232" x2="179" y2="221"/>
  </g>
  <!-- жёлтая ступица -->
  <circle cx="160" cy="202" r="5" fill="#FFDD2D"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- FORTS PILOT: штурвал/компас, жёлтый #FFDD2D на графите #0B0E13, плоский line-art -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="#0B0E13" stroke="#1E2632" stroke-width="4"/>
  <g stroke="#FFDD2D" stroke-width="16" stroke-linecap="round" fill="none">
    <!-- спицы с ручками -->
    <g id="spokes">
      <line x1="256" y1="256" x2="256" y2="96"/>
      <line x1="256" y1="256" x2="369.3" y2="142.7"/>
      <line x1="256" y1="256" x2="416" y2="256"/>
      <line x1="256" y1="256" x2="369.3" y2="369.3"/>
      <line x1="256" y1="256" x2="256" y2="416"/>
      <line x1="256" y1="256" x2="142.7" y2="369.3"/>
      <line x1="256" y1="256" x2="96" y2="256"/>
      <line x1="256" y1="256" x2="142.7" y2="142.7"/>
    </g>
    <!-- обод -->
    <circle cx="256" cy="256" r="136"/>
    <!-- ступица -->
    <circle cx="256" cy="256" r="30" fill="#FFDD2D" stroke="none"/>
  </g>
  <!-- ручки на концах спиц -->
  <g fill="#FFDD2D">
    <circle cx="256" cy="88" r="18"/>
    <circle cx="374.9" cy="137.1" r="18"/>
    <circle cx="424" cy="256" r="18"/>
    <circle cx="374.9" cy="374.9" r="18"/>
    <circle cx="256" cy="424" r="18"/>
    <circle cx="137.1" cy="374.9" r="18"/>
    <circle cx="88" cy="256" r="18"/>
    <circle cx="137.1" cy="137.1" r="18"/>
  </g>
  <!-- отметка «север» компаса -->
  <circle cx="256" cy="52" r="8" fill="#FFDD2D"/>
</svg>
